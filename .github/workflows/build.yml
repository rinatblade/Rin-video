name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download fonts
        run: bash scripts/get-fonts.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk Rin-video.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Rin-video
          path: Rin-video.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Rin-video.apk \
            --title "Rin-video build-${{ github.run_number }}" \
            --notes "Автоматическая сборка #${{ github.run_number }}"
